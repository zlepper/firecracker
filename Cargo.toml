[workspace]
members = ["src/*"]
# We exclude the jailer below so that it does not get build by default. This is because "cargo build" compiles
# for the gnu target, and the jailer needs a statically compiled binary to work correctly.
# See https://github.com/firecracker-microvm/firecracker/commit/3bf285c8f8a815149923c562dd7edaffcaf10c4e
# and https://github.com/firecracker-microvm/firecracker/issues/2102
default-members = [
    "src/clippy-tracing",
    "src/cpu-template-helper",
    "src/firecracker",
    "src/rebase-snap",
    "src/seccompiler",
    "src/snapshot-editor",
    "src/acpi-tables",
]
resolver = "2"
# Vendored crates patched for Hermes live outside the workspace.
exclude = ["third_party"]

[workspace.lints.rust]
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
ptr_as_ptr = "warn"
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
exit = "warn"
tests_outside_test_module = "warn"
assertions_on_result_states = "warn"
error_impl_error = "warn"
or_fun_call = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
strip = "none"

[profile.bench]
strip = "debuginfo"

# Hermes: vfio-ioctls with group-node based device opening (no sysfs in the jail).
[patch.crates-io]
vfio-ioctls = { path = "third_party/vfio-ioctls" }
